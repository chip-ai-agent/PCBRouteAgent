name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true          # PCBWorld Python sources; the engine is not needed for these tests
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: ruff check route_agent/global_planner route_agent/tests/test_global_planner.py route_agent/tests/test_global_images.py
      - run: python -m unittest discover -s route_agent/tests -v
